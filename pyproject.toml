[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admixpy"
version = "0.2.6"
description = "Fast Python implementation of ADMIXTOOLS-style f-statistics, qpadm, and qpwave"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[tool.setuptools.packages.find]
include = ["admixpy*"]
