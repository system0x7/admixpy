[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admixpy"
dynamic = ["version"]
description = "Fast Python implementation of ADMIXTOOLS-style f-statistics, qpadm, and qpwave"
readme = "README.md"
license = "MIT"
authors = [
    { name = "system0x7" },
]
requires-python = ">=3.10"
keywords = ["population genetics", "f-statistics", "qpadm", "qpwave", "admixture"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/system0x7/admixpy"
Repository = "https://github.com/system0x7/admixpy"
Issues = "https://github.com/system0x7/admixpy/issues"

[tool.setuptools.packages.find]
include = ["admixpy*"]

[tool.setuptools.dynamic]
version = { attr = "admixpy.__version__" }
