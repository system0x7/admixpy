name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Install AdmixPy
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    container: python:3.14-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/admixpy-smoke
          /tmp/admixpy-smoke/bin/python -m pip install --no-cache-dir dist/*.whl
          cd /tmp
          /tmp/admixpy-smoke/bin/python -c "from importlib.metadata import version; import admixpy; assert admixpy.__version__ == version('admixpy')"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
